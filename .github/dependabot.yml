version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          minor-and-patch:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
